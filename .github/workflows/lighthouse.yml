name: Publish Lighthouse images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Panda Git tag to create after merging the generated release PR (vX.Y.Z or vX.Y.Z-rc.N).
        required: true
        type: string
      profile:
        description: Active hardfork name, or all (currently Gloas only; Pectra is paused).
        required: true
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: lighthouse-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Deno
        run: bash .github/scripts/setup-deno.sh
      - name: Validate release version and unchanged profile locks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PANDA_VERSION: ${{ inputs.version }}
          PROFILE: ${{ inputs.profile }}
        run: deno run -A scripts/release_pr.ts check
      - id: select
        env:
          PROFILE: ${{ inputs.profile }}
        run: deno run -A scripts/lighthouse_ci.ts matrix "$PROFILE"

  lighthouse:
    needs: select
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      group: panda-lighthouse-${{ matrix.profile }}-${{ matrix.tag }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      PROFILE: ${{ matrix.profile }}
      BAKE: ${{ matrix.bake }}
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Deno
        run: bash .github/scripts/setup-deno.sh
      - name: Resolve upstream/baker version in the registry
        id: client
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: deno run -A scripts/lighthouse_ci.ts resolve "$PROFILE"
      - run: deno task check && deno task test
      - name: Reuse published Lighthouse or compile the new upstream/baker pair
        env:
          LIGHTHOUSE_DIGEST: ${{ steps.client.outputs.digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$LIGHTHOUSE_DIGEST" ]; then
            deno task bake "$PROFILE" --tag "$BAKE" --reuse-cl "$LIGHTHOUSE_DIGEST"
          else
            deno task bake "$PROFILE" --tag "$BAKE"
          fi
      # bake already ran the native Rust regressions. Full EL/CL profile and packaged-service
      # checks gate Panda publication in images.yml, after this binary is durable in GHCR.
      - name: Publish or reuse Lighthouse and produce the client lock
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: deno run -A scripts/lighthouse_ci.ts publish "$PROFILE"
      - name: Upload published lock for the release PR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-lock-${{ matrix.profile }}
          path: .cache/client-releases/${{ matrix.profile }}/clients.lock.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
      - name: Upload client lock and native bake identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-${{ matrix.profile }}-${{ matrix.tag }}
          include-hidden-files: true
          overwrite: true
          path: |
            .cache/client-releases/${{ matrix.profile }}/
            bakes/${{ matrix.profile }}/tags/${{ matrix.bake }}.json

  release-pr:
    needs: [select, lighthouse]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PANDA_VERSION: ${{ inputs.version }}
      PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Deno
        run: bash .github/scripts/setup-deno.sh
      - name: Download locks from this successful publication
        env:
          RELEASE_MATRIX: ${{ needs.select.outputs.matrix }}
        run: |
          while IFS= read -r profile; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "lighthouse-lock-$profile" --dir ".cache/release-locks/lighthouse-lock-$profile"
          done < <(jq -r '.include[].profile' <<< "$RELEASE_MATRIX")
      - name: Open release PR with Lighthouse versions, client pins and Panda tag
        run: deno run -A scripts/release_pr.ts open
