name: Release merged Panda PR

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: panda-release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'codex/release-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Install Deno
        run: bash .github/scripts/setup-deno.sh
      - name: Validate merged pins, create the Git tag and trigger Panda publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: deno run -A scripts/release_pr.ts tag
